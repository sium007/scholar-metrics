name: Update Google Scholar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download scholar.py
        run: |
          curl -L -o scholar.py https://raw.githubusercontent.com/ckreibich/scholar.py/master/scholar.py

      - name: Run updater
        run: python update.py

      - name: Commit metrics
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add metrics.json
          git diff --cached --quiet || git commit -m "Update Scholar metrics"
          git push
